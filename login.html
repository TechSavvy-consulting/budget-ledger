<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jess's Simple Household Budget Ledger Login</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="login-page">
    <main class="login-shell">
      <section class="login-panel">
        <img class="brand-logo login-logo" src="assets/jess-simple-budget-ledger-logo.png" alt="Jess's Simple Household Budget Ledger" />
        <form id="loginForm" class="login-form">
          <label>
            <span>Username</span>
            <input id="username" name="username" type="text" autocomplete="username" required autofocus />
          </label>
          <label>
            <span>Password</span>
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              required
            />
          </label>
          <button class="primary-button wide" type="submit">Sign in</button>
          <p id="loginMessage" class="login-message" role="alert"></p>
        </form>
      </section>
    </main>
    <script src="login.js"></script>
  </body>
</html>
